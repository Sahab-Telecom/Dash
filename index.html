<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virgin Mobile - لوحة المبيعات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root{--main:#6d28d9;--main2:#9333ea;--bg:#f5f3ff;--text:#2e1065;--shadow:0 8px 28px rgba(46,16,101,.14)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}header{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;box-shadow:0 4px 22px rgba(46,16,101,.25)}.header-inner{max-width:1200px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--main);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}.brand h1{font-size:20px;font-weight:900}.brand p{font-size:12px;opacity:.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:9px 14px;font-family:'Cairo';font-weight:800;cursor:pointer}.btn-light{background:rgba(255,255,255,.16);color:#fff}.btn-white{background:#fff;color:var(--main)}main{max-width:1200px;margin:0 auto;padding:28px}.empty{background:#fff;border-radius:24px;padding:40px 28px;box-shadow:var(--shadow);text-align:center}.empty .icon{font-size:54px;margin-bottom:12px}.empty h2{font-size:24px;font-weight:900;margin-bottom:8px}.empty p{font-size:14px;color:#6b7280;line-height:1.9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:24px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow);border-right:4px solid var(--main2)}.card span{font-size:12px;color:#6b7280}.card strong{display:block;font-size:28px;margin-top:4px}@media(max-width:650px){.header-inner{padding:14px 16px;flex-direction:column;align-items:flex-start}main{padding:16px}.brand h1{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand"><div class="logo">V</div><div><h1>Virgin Mobile Dashboard</h1><p>لوحة فيرجن الجديدة - فارغة للبناء</p></div></div>
    <div class="actions"><button class="btn btn-light" onclick="location.href='../'">اختيار الشركة</button><button class="btn btn-white" onclick="logout()">تسجيل خروج</button></div>
  </div>
</header>
<main>
  <section class="empty">
    <div class="icon">🟣</div>
    <h2>لوحة فيرجن جاهزة كبداية</h2>
    <p>هذه الصفحة مستقلة عن ريدبول بالكامل. حالياً لا توجد بيانات أو ملفات أو حسابات مبيعات، ونقدر نبنيها خطوة بخطوة حسب نموذج فيرجن.</p>
    <div class="cards">
      <div class="card"><span>إجمالي المبيعات</span><strong>0</strong></div>
      <div class="card"><span>إجمالي الإيراد</span><strong>0</strong></div>
      <div class="card"><span>عدد الملفات</span><strong>0</strong></div>
      <div class="card"><span>آخر تحديث</span><strong>-</strong></div>
    </div>
  </section>
</main>
<script>
(function guard(){
  try{ const s=JSON.parse(localStorage.getItem('st_user')||'null'); if(s && s.username) return; }catch(e){}
  location.href='../';
})();
function logout(){localStorage.removeItem('st_user');location.href='../'}
</script>
</body>
</html>
